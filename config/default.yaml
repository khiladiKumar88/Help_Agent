# PaperMind defaults. Secrets never go here — use .env (see .env.example).
server:
  host: 127.0.0.1
  port: 8000

db_url: sqlite:///papermind.db     # override with PAPERMIND_DB_URL (e.g. postgresql+psycopg://...)
equity_snapshot_seconds: 60

data:
  stale_after_seconds: 10          # no tick for this long => stale => no new entries (rule R004)
  history_db_url: sqlite:///history.db   # local OHLCV cache for backtests/replays (override: PAPERMIND_HISTORY_DB_URL)
  crypto:
    provider: ccxt                 # ccxt | simulated   (override: PAPERMIND_CRYPTO_PROVIDER)
    exchange: binanceusdm          # any ccxt id; public market data only
    feed: ws                       # ws (falls back to poll automatically) | poll
    poll_interval_seconds: 1.0
    candle_poll_seconds: 20
    funding_poll_seconds: 300
    history_candles: 500
    symbols:
      - BTC/USDT:USDT
      - ETH/USDT:USDT
    simulated:                     # offline deterministic feed, clearly labelled SIMULATED in the UI
      seed: 42
      tick_interval_seconds: 1.0
      annual_vol: 0.6
      spread_bps: 1
      start_prices:
        BTC/USDT:USDT: 65000
        ETH/USDT:USDT: 3000

# --- Phase 3: the LLM analyst. It judges one scanner signal at a time and can only ever make an
# order STRICTER. It never touches the risk rules, and any failure means NO TRADE.
llm:
  provider: gemini                 # gemini | fake (deterministic, offline) | off (take every signal)
  model: gemini-3.8-flash          # current free-tier Flash model; any id the provider accepts
  api_key_env: GEMINI_API_KEY      # read from .env only — never logged, never put in a prompt
  # 60s, not 30: a live call measured ~9s, but a hard prompt can run much longer and this is
  # a PER-ATTEMPT budget, so one slow reply no longer burns an attempt. Signals arrive on
  # closed 15m candles, so latency is not the constraint. See `limits.max_retries` for the
  # worst-case total, which the analyst holds the event bus for.
  timeout_seconds: 60
  temperature: 0.2
  thinking_level: low              # minimal | low | medium | high
  max_output_tokens: 1024
  confidence_threshold: 70         # below this the answer is treated as SKIP
  prompt_version: analyst_v1       # template in backend/papermind/analyst/prompts/
  cache_responses: true            # cache by prompt hash so re-running a replay costs no quota
  log_prompts: true                # store the full prompt with each call record
  limits:
    # Google does NOT publish the free-tier numbers any more — your own limits are shown in
    # Google AI Studio. These defaults are deliberately conservative: set them to YOUR key's.
    requests_per_minute: 10
    tokens_per_minute: 250000      # null to stop tracking input tokens per minute
    requests_per_day: 200          # hard daily budget; the agent PAUSES when it is used up
    max_retries: 3                 # retries on 429 / 5xx, exponential backoff with jitter
    backoff_base_seconds: 2
    backoff_max_seconds: 32
