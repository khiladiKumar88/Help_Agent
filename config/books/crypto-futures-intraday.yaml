# Book = market x segment x style. Own wallet (USDT), own risk limits, own stats.
id: crypto-futures-intraday
market: crypto
segment: futures
style: intraday
currency: USDT
mode: manual
starting_capital: 1000
data_source: crypto
instruments:                       # symbols; specs come from the exchange instrument master
  - BTC/USDT:USDT
  - ETH/USDT:USDT
charges: crypto_binanceusdm
trading_day_tz: UTC                # daily limits reset at 00:00 UTC
timeframes:
  signal: 15m
  execution: 1m
slippage:
  # Book-wide fallback. Kept wide on purpose: an unmeasured instrument should cost MORE, not
  # less, until someone measures it. Per-instrument entries below carry the measurement.
  model: bps
  bps: 2                           # adverse slippage on top of bid/ask
  est_spread_bps: 2                # used only when bid/ask are missing (always, in backtests)
  per_instrument:
    # Measured from 30 binanceusdm order-book snapshots on 2026-10-11. The top-of-book spread on
    # these perps is a single tick and a 25,000 USDT clip does not clear level 1, so the real
    # one-side cost is a tiny fraction of a bp. The assumption below is still ~35-70x the
    # measured half-spread, which is the allowance for fast moves, latency and stop-market
    # execution — deliberately pessimistic, but no longer absurd. The old 3 bps per side was
    # ~250x the observed cost for BTC and swamped the strategy's own edge.
    BTC/USDT:USDT:
      bps: 0.4
      est_spread_bps: 0.02         # ~1.7x the observed full spread
      observed_spread_bps: 0.012   # full top-of-book spread, median of 30 snapshots
      source: binanceusdm order book (fetch_order_book, public)
      as_of: 2026-10-11
      notes: 25k USDT buy filled 0.006 bps from mid; no depth impact at our size.
    ETH/USDT:USDT:
      bps: 0.4
      est_spread_bps: 0.06         # ~1.5x the observed full spread
      observed_spread_bps: 0.040
      source: binanceusdm order book (fetch_order_book, public)
      as_of: 2026-10-11
      notes: 25k USDT buy filled 0.020 bps from mid; no depth impact at our size.
risk:
  max_risk_per_trade_pct: 1        # % of equity, incl. estimated round-trip fees
  max_leverage: 3
  max_open_positions: 2
  max_trades_per_day: 10
  daily_loss_limit_pct: 3          # % of start-of-day equity; halts the book for the day
  flatten_on_daily_loss: true
session: null                      # 24x7
# --- Phase 2: scanner + agent. Strategies run on closed `timeframes.signal` candles.
# In Manual mode signals are recorded and shown; the agent only trades in Auto (Phase 3) or in
# backtests/replays. Parameters come from each strategy's defaults unless overridden here.
strategies:
  - id: ema_pullback
  - id: supertrend_flip
  - id: vwap_reclaim
  - id: rsi_mean_reversion
  - id: funding_fade
  - id: orb            # designed for India's 09:15 open; on crypto it uses the 00:00 UTC day open
    enabled: false
scanner:
  cooldown_bars: 3     # min bars between two signals of the same strategy on the same instrument
  window: 250          # closed candles fed to indicators
baseline:              # random-entry benchmark in a separate shadow wallet (same risk + frequency)
  enabled: true
  seed: 7
  max_delay_bars: 4
# --- Phase 3: Co-pilot cards and the shadow book that measures the analyst's filter.
copilot:
  card_ttl_bars: 1               # a card expires one signal bar (15m) after it appears
  # card_ttl_seconds: 300        # absolute override, if you prefer a fixed deadline
  shadow_track_rejected: true    # record what a card you rejected would have done
shadow_raw_strategy: true        # also trade EVERY signal in `shadow_raw`, so we can see whether
                                 # the analyst's TAKE/SKIP filter beats taking everything.
                                 # Only runs when an analyst is actually filtering.
