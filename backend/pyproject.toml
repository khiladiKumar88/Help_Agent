[project]
name = "papermind"
version = "0.1.0"
description = "PaperMind — self-improving AI paper-trading agent (paper only)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "pyyaml>=6.0",
  "ccxt>=4.3",
  "apscheduler>=3.10,<4",
  "httpx>=0.27",
  "numpy>=2.0",
  "alembic>=1.13",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["papermind"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["B008", "RUF012", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
# No `python_version`: mypy then checks against the interpreter it runs on, which is the one
# whose dependencies are actually installed. Pinning it to the 3.11 floor breaks on newer
# interpreters, because uv resolves numpy 2.5.x there and its stubs use PEP 695 `type`
# statements that mypy refuses to parse under a 3.11 target. `requires-python = ">=3.11"`
# still holds (3.11 resolves numpy 2.4.x); ruff's target-version guards the syntax floor.
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["ccxt.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:ccxt.*", "ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["papermind"]
branch = true

[tool.coverage.report]
skip_empty = true
